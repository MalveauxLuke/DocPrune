[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "docprune-reproduction"
version = "0.1.0"
description = "Faithful reproduction scaffold for DocPrune (CVPR 2026)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "numpy==1.26.4",
  "torch>=2.4,<2.7",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<0.13",
]
model = [
  "transformers==4.46.3",
  "qwen-vl-utils==0.0.8",
]

[project.scripts]
docprune-m3docvqa = "docprune.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["docprune*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
